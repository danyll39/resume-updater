# Render Blueprint: lets Render set up this app from the repo.
# The Gemini key is entered in the Render dashboard, never stored here.
services:
  - type: web
    name: resume-updater
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
